name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the Ubuntu runner image no longer offers Python 3.9; the oldest supported version is tested on Windows
          - {os: windows-latest, python: '3.9'}
          - {os: windows-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q skills tests
      - run: python -m unittest discover -s tests -v
